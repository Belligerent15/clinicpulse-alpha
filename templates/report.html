{% extends 'base.html' %}
{% block title %}Report an issue — {{ clinic.name }}{% endblock %}

{% block content %}
<section class="page-head" style="margin-bottom: 24px;">
  <h1 style="margin: 0 0 8px 0;">Report incorrect information</h1>
  <p class="muted" style="margin: 0;">Help us keep <strong>{{ clinic.name }}</strong> accurate for the community.</p>
</section>

<div style="max-width: 600px;">
  <form method="post" class="form-card" novalidate>
    <label>
      <span class="label">Your name (optional)</span>
      <input type="text" name="reporter_name" value="{{ form.reporter_name or '' }}" maxlength="120" placeholder="e.g. Thabo M.">
    </label>
    
    <label>
      <span class="label">Contact (phone or email, optional)</span>
      <input type="text" name="contact_details" value="{{ form.contact_details or '' }}" maxlength="160" placeholder="So we can follow up if needed">
    </label>
    
    <label>
      <span class="label">Issue type <span class="req">*</span></span>
      <select name="issue_type" required>
        <option value="">Choose an issue…</option>
        {% set types = ['Hours wrong', 'Services wrong', 'Phone wrong', 'Address/location wrong', 'Clinic closed/unavailable', 'Other'] %}
        {% for t in types %}
          <option value="{{ t }}" {% if form.issue_type == t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
    </label>
    
    <label>
      <span class="label">Describe the problem <span class="req">*</span></span>
      <textarea name="description" rows="5" required maxlength="2000" placeholder="What did you experience at the clinic?">{{ form.description or '' }}</textarea>
    </label>

    <div class="form-actions" style="margin-top: 16px;">
      <button class="btn btn-primary" type="submit" style="flex: 1;">Submit report</button>
      <a class="btn btn-ghost" href="{{ url_for('clinic_detail', clinic_id=clinic.id) }}" style="flex: 1; text-align: center; background: #f8fafc;">Cancel</a>
    </div>
    
    <p class="muted" style="font-size: 0.85rem; text-align: center; margin-top: 16px; margin-bottom: 0;">
      Thank you for helping keep ClinicPulse accurate for everyone.
    </p>
  </form>
</div>
{% endblock %}
