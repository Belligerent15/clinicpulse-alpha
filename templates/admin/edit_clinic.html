{% extends 'base.html' %}
{% block title %}Edit {{ clinic.name }} — ClinicPulse admin{% endblock %}

{% block content %}
<section class="page-head">
  <h1>Edit clinic</h1>
  <p class="muted">{{ clinic.name }}</p>
</section>

<form method="post" class="form-card">
  <div class="grid-2">
    <label>
      <span class="label">Name <span class="req">*</span></span>
      <input type="text" name="name" value="{{ clinic.name }}" required>
    </label>
    <label>
      <span class="label">Phone</span>
      <input type="text" name="phone" value="{{ clinic.phone or '' }}">
    </label>
    <label>
      <span class="label">Village</span>
      <input type="text" name="village" value="{{ clinic.village or '' }}">
    </label>
    <label>
      <span class="label">Town</span>
      <input type="text" name="town" value="{{ clinic.town or '' }}">
    </label>
    <label class="col-span-2">
      <span class="label">Address</span>
      <input type="text" name="address" value="{{ clinic.address or '' }}">
    </label>
    <label>
      <span class="label">Latitude</span>
      <input type="text" inputmode="decimal" name="latitude" value="{{ clinic.latitude or '' }}">
    </label>
    <label>
      <span class="label">Longitude</span>
      <input type="text" inputmode="decimal" name="longitude" value="{{ clinic.longitude or '' }}">
    </label>
    <label class="col-span-2">
      <span class="label">Operating hours</span>
      <input type="text" name="operating_hours" value="{{ clinic.operating_hours or '' }}">
    </label>
    <label class="col-span-2">
      <span class="label">Services (separate with “ ; ”)</span>
      <input type="text" name="services" value="{{ clinic.services or '' }}">
    </label>
  </div>

  <fieldset class="status-fieldset">
    <legend>Live status</legend>
    <div class="grid-3">
      <label>
        <span class="label">Status</span>
        <select name="status">
          {% for s in ['Open', 'Closed', 'Limited'] %}
            <option value="{{ s }}" {% if clinic.status == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        <span class="label">Queue</span>
        <select name="queue_status">
          {% for s in ['Short', 'Moderate', 'Long'] %}
            <option value="{{ s }}" {% if clinic.queue_status == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </label>
      <label>
        <span class="label">Chronic meds</span>
        <select name="medication_status">
          {% for s in ['Available', 'Limited', 'Unavailable'] %}
            <option value="{{ s }}" {% if clinic.medication_status == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </label>
    </div>
    <label>
      <span class="label">Note (optional, for the update log)</span>
      <input type="text" name="note" maxlength="300">
    </label>
    <label class="inline">
      <input type="checkbox" name="is_published" value="1" {% if clinic.is_published %}checked{% endif %}>
      Published (visible to public)
    </label>
  </fieldset>

  <div class="form-actions">
    <button type="submit" class="btn btn-primary">Save changes</button>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-ghost">Cancel</a>
  </div>
</form>
{% endblock %}
